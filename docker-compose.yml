# docker-compose.yml
version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"  # Backend on 8000
    environment:
      - ENVIRONMENT=development
      - BACKEND_PORT=8000
    volumes:
      - ./backend:/app
      - ./video_output:/video_output
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  mobile:
    build: ./mobile
    ports:
      - "8001:8001"  # Mobile on 8001
    environment:
      - ENVIRONMENT=development
      - MOBILE_PORT=8001
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./mobile:/app
    depends_on:
      - backend
    command: uvicorn mobile.app.main:app --host 0.0.0.0 --port 8001 --reload